[package]
name = "auto-resume"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
description = "Relaunch dead Herdr agent panes into their previous sessions (claude, opencode, kiro-cli)"
license = "MIT"
repository = "https://github.com/quinnjr/herdr-auto-resume"
readme = "README.md"
keywords = ["herdr", "agents", "terminal", "cli", "automation"]
categories = ["command-line-utilities"]
exclude = ["docs/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
